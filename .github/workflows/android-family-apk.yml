name: Gerar APK MinhaLista Familia
on:
  push:
    branches: [main]
    paths:
      - 'android-family/**'
      - 'index.html'
      - 'icon.svg'
      - 'manifest.json'
      - '.github/workflows/android-family-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK ja vem preinstalado no runner Ubuntu; evitar sdkmanager tools obsoleto.
      - name: Verificar Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Gerar icone Android a partir do MinhaLista SVG
        run: |
          python -m pip install --quiet cairosvg
          mkdir -p android-family/app/src/main/res/mipmap-mdpi android-family/app/src/main/res/mipmap-hdpi android-family/app/src/main/res/mipmap-xhdpi android-family/app/src/main/res/mipmap-xxhdpi android-family/app/src/main/res/mipmap-xxxhdpi
          python -c "import cairosvg; from pathlib import Path; sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}; [(cairosvg.svg2png(url='icon.svg',write_to=str(Path('android-family/app/src/main/res')/('mipmap-'+density)/name),output_width=size,output_height=size)) for density,size in sizes.items() for name in ('ic_launcher.png','ic_launcher_round.png')]"
      - name: Build APK de teste
        working-directory: android-family
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Checklist-App-Familia-APK
          path: android-family/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
