name: Gerar APK Checklist Familia
on:
  push:
    branches: [main]
    paths:
      - 'android-family/**'
      - '.github/workflows/android-family-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK ja vem preinstalado no runner Ubuntu; evitar sdkmanager tools obsoleto.
      - name: Verificar Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK de teste
        working-directory: android-family
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Checklist-App-Familia-APK
          path: android-family/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
